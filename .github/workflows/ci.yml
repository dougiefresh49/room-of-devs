name: CI

on:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - run: pnpm typecheck

      - run: pnpm check-fixtures

      # lint joins once BIOME-LINT-REPORT.md debt is paid (~494 pre-existing errors).
      - run: pnpm format:check
